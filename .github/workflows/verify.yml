name: Verify Phoenix
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python scripts/verify.py
