[theme]
base = "light"
primaryColor = "#596747"
backgroundColor = "#f3efe5"
secondaryBackgroundColor = "#eae7dc"
textColor = "#34382f"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
address = "127.0.0.1"
maxUploadSize = 10

[client]
toolbarMode = "minimal"

[theme.dark]
primaryColor = "#126B60"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#EDF1F5"
textColor = "#17212B"

[theme.dark.sidebar]
backgroundColor = "#EDF1F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17212B"
